[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duplicate-finder"
version = "0.1.0"
description = "Safe, Windows-friendly duplicate file finder"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["typer>=0.15", "rich>=13.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14"]

[project.scripts]
duplicate-finder = "duplicate_finder.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/duplicate_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
